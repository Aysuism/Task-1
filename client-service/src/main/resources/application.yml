server:
  port: 8081

spring:
  application:
    name: client-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      storage:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
storage:
  service:
    url: ${STORAGE_SERVICE_URL:http://localhost:8082}

logging:
  level:
    com.example.client.feign.StorageClient: DEBUG