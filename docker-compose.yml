services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: storagedb
      POSTGRES_USER: storage_user
      POSTGRES_PASSWORD: storage_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U storage_user -d storagedb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-service:
    build: ./storage-service
    container_name: storage-service
    ports:
      - "8082:8082"
      - "9090:9090"
    environment:
      GRPC_SERVER_PORT: 9090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: storagedb
      DB_USER: storage_user
      DB_PASSWORD: storage_pass
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  client-service:
    build: ./client-service
    container_name: client-service
    ports:
      - "8081:8081"
    environment:
      STORAGE_SERVICE_URL: http://storage-service:8082
      STORAGE_GRPC_HOST: storage-service
      STORAGE_GRPC_PORT: 9090
    depends_on:
      - storage-service

  email-service:
    build: ./email-service
    container_name: email-service
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres-data: