server:
  port: 8082

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

spring:
  application:
    name: storage-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:storagedb}
    username: ${DB_USER:storage_user}
    password: ${DB_PASSWORD:storage_pass}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false