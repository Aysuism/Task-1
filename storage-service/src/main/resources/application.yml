server:
  port: 8082

spring:
  application:
    name: storage-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:storagedb}
    username: ${DB_USER:storage_user}
    password: ${DB_PASSWORD:storage_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false